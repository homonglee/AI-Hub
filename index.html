<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <img src="images/hovision_logo.png" alt="AI Hub Logo" class="logo-icon">
                <span class="logo-text">AI Hub</span>
            </div>
            <div class="header-icon">☀️</div>
        </header>
        
        <hr class="divider">
        
        <!-- Main Title -->
        <section class="main-title">
            <h1>AI 도구 허브</h1>
            <p>최신 AI 도구들을 카테고리별로 쉽게 찾아보고 활용해보세요</p>
        </section>
        
        <hr class="divider">
        
        <!-- AI Tools Categories -->
        <main class="categories" id="categories">
            <!-- Categories will be dynamically loaded here -->
        </main>
        
        <hr class="divider">
        
        <!-- Contact Information -->
        <section class="contact">
            <h2>연락처</h2>
            <div class="contact-info">
                <div class="contact-item">
                    <span class="contact-icon">📍</span>
                    <span class="contact-label">본사 주소:</span>
                    <span class="contact-value" id="head-office"></span>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">📍</span>
                    <span class="contact-label">교육센터:</span>
                    <span class="contact-value" id="education-center"></span>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">📞</span>
                    <span class="contact-value" id="phone"></span>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">✉️</span>
                    <span class="contact-value" id="email"></span>
                </div>
            </div>
        </section>
        
        <hr class="divider">
        
        <!-- Footer -->
        <footer class="footer">
            <p>© 2025 호연지재 All rights reserved.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
